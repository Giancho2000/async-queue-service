version: "1.0"
services:
  postgres:
    image: postgres:16-alpine
    container_name: asyncqproject_container
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${POSTGRES_DB:-queue_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-queue_db}"] 
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
      image: redis:7-alpine
      container_name: asyncq_redis
      restart: unless-stopped
      command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-change-me}"]
      ports:
        - "6379:6379"
      volumes:
        - redis_data:/data               # persiste (AOF) si lo activas
      healthcheck:
        test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-change-me} ping | grep PONG"]
        interval: 10s
        timeout: 5s
        retries: 5

volumes:
  postgres_data:
  redis_data: